spring:
  application:
    name: resqroute
  datasource:
    url: jdbc:mysql://localhost:3306/resqroute?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:resqroute}
    password: ${DB_PASSWORD:resqroute}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  servlet:
    multipart:
      max-file-size: 5MB

server:
  port: 8080
  error:
    include-message: always

resqroute:
  jwt:
    secret: ${JWT_SECRET:cjV3aEFZS1hYb3pIbWd0d0lZQ3VkS2ZBSG5FcmVQcVFlblgxd0V2U25reA==}
    expiration-minutes: 720
  cors:
    allowed-origins: http://localhost:8080,http://127.0.0.1:8080
  seed:
    enabled: true

logging:
  level:
    com.resqroute: INFO
    org.springframework.security: WARN
